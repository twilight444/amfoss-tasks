<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

    <div class="container">
        <button id="themeBtn">☀️</button>
        <h1>Crypto Tracker</h1>

        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Search crypto...">
            <button id="wishlistBtn" class="wishlist-toggle-btn">★ Wishlist</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Coin</th>
                        <th>Price</th>
                        <th>Market Cap</th>
                        <th>24h %</th>
                    </tr>
                </thead>
                <tbody id="cryptoTable">
                    <!-- Populated dynamically via script.js -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
